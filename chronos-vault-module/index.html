  <body class="bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100 antialiased selection:bg-blue-600 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      (function () {
        var initialVersion = null;
        var SCROLL_KEY = 'chronos_scroll_state_v2';
        var LEGACY_SCROLL_KEY = 'chronos_scroll_y_v1';
        var userInteractedSinceLoad = false;

        try {
          if ('scrollRestoration' in history) {
            history.scrollRestoration = 'manual';
          }
        } catch (e) {}

        function readSavedScrollState() {
          try {
            var raw = sessionStorage.getItem(SCROLL_KEY);
            if (raw) {
              var parsed = JSON.parse(raw);
              if (parsed && typeof parsed.y === 'number') return parsed;
            }
            var legacyY = sessionStorage.getItem(LEGACY_SCROLL_KEY);
            if (legacyY) {
              return { y: parseInt(legacyY, 10) || 0, x: 0, containers: [] };
            }
          } catch (e) {}
          return null;
        }

        function saveCurrentScrollState() {
          try {
            var y = window.scrollY || document.documentElement.scrollTop || document.body.scrollTop || 0;
            var x = window.scrollX || document.documentElement.scrollLeft || 0;
            var containers = [];
            var candidates = document.querySelectorAll('#root [class*="overflow-y"], main, [data-scroll-container]');
            for (var i = 0; i < candidates.length && i < 24; i++) {
              var el = candidates[i];
              if (el.scrollTop > 0) {
                containers.push({ idx: i, top: el.scrollTop });
              }
            }
            sessionStorage.setItem(SCROLL_KEY, JSON.stringify({ y: y, x: x, containers: containers, ts: Date.now() }));
            sessionStorage.setItem(LEGACY_SCROLL_KEY, String(y));
          } catch (e) {}
        }

        var markUserScroll = function () {
          userInteractedSinceLoad = true;
        };
        window.addEventListener('wheel', markUserScroll, { passive: true, once: true });
        window.addEventListener('touchmove', markUserScroll, { passive: true, once: true });

        var scrollSaveTimer = null;
        window.addEventListener('scroll', function () {
          if (scrollSaveTimer) clearTimeout(scrollSaveTimer);
          scrollSaveTimer = setTimeout(saveCurrentScrollState, 120);
        }, { passive: true });
        document.addEventListener('scroll', function (ev) {
          if (ev.target && ev.target !== document) {
            if (scrollSaveTimer) clearTimeout(scrollSaveTimer);
            scrollSaveTimer = setTimeout(saveCurrentScrollState, 120);
          }
        }, { passive: true, capture: true });
        window.addEventListener('beforeunload', saveCurrentScrollState);
        window.addEventListener('pagehide', saveCurrentScrollState);

        var savedState = readSavedScrollState();
        if (savedState && (savedState.y > 0 || (savedState.containers && savedState.containers.length > 0))) {
          var applyRestore = function () {
            if (userInteractedSinceLoad) return true;
            if (savedState.y > 0) {
              var maxScrollable = Math.max(0, document.documentElement.scrollHeight - window.innerHeight);
              window.scrollTo(savedState.x || 0, Math.min(savedState.y, Math.max(savedState.y, maxScrollable)));
            }
            if (savedState.containers && savedState.containers.length > 0) {
              var candidates = document.querySelectorAll('#root [class*="overflow-y"], main, [data-scroll-container]');
              for (var j = 0; j < savedState.containers.length; j++) {
                var c = savedState.containers[j];
                if (candidates[c.idx] && c.top > 0) {
                  candidates[c.idx].scrollTop = c.top;
                }
              }
            }
            var currentY = window.scrollY || document.documentElement.scrollTop || 0;
            return Math.abs(currentY - savedState.y) < 12;
          };

          [0, 80, 220, 480, 900, 1500].forEach(function (delay) {
            setTimeout(applyRestore, delay);
          });

          var rootEl = document.getElementById('root');
          if (rootEl && typeof MutationObserver !== 'undefined') {
            var mo = new MutationObserver(function () {
              if (userInteractedSinceLoad) {
                mo.disconnect();
                return;
              }
              if (applyRestore()) {
                mo.disconnect();
              }
            });
            mo.observe(rootEl, { childList: true, subtree: true });
            setTimeout(function () { mo.disconnect(); }, 3000);
          }
        }

        function unlockWindowState() {
          try {
            if (document.pointerLockElement && document.exitPointerLock) {
              document.exitPointerLock();
            }
            if (document.fullscreenElement && document.exitFullscreen) {
              document.exitFullscreen().catch(function () {});
            }
            document.documentElement.style.pointerEvents = '';
            document.body.style.pointerEvents = '';
            if (document.body.style.overflow === 'hidden') {
              document.body.style.overflow = '';
            }
            window.onbeforeunload = null;
          } catch (e) {}
        }
        var lastEscTs = 0;
        window.addEventListener('keydown', function (ev) {
          if (ev.key === 'Escape') {
            var now = Date.now();
            if (now - lastEscTs < 600) unlockWindowState();
            lastEscTs = now;
          } else if (ev.ctrlKey && ev.shiftKey && (ev.key === 'U' || ev.key === 'u')) {
            unlockWindowState();
          }
        }, true);
        setInterval(function () {
          if (document.body && document.body.style.pointerEvents === 'none') {
            document.body.style.pointerEvents = '';
          }
        }, 2000);

        var badge = document.createElement('div');
        badge.id = 'chronos-live-4s-badge';
        badge.style.cssText =
          'position:fixed;right:12px;bottom:12px;z-index:9999;padding:4px 10px;border-radius:999px;font:600 11px/1.2 ui-monospace,SFMono-Regular,Menlo,monospace;background:rgba(15,23,42,0.82);color:#e2e8f0;border:1px solid rgba(56,189,248,0.45);backdrop-filter:blur(6px);pointer-events:none;transition:border-color 0.35s ease,opacity 0.35s ease;';
        function fmtTime() {
          return new Date().toLocaleTimeString('pl-PL', { hour12: false });
        }
        badge.textContent = '● Live 5 min · ' + fmtTime();
        document.body.appendChild(badge);

        setInterval(function () {
          if (document.visibilityState !== 'visible') return;
          if (document.querySelector('input:focus, textarea:focus, select:focus, [contenteditable="true"]:focus')) {
            return;
          }
          saveCurrentScrollState();
          var beforeY = window.scrollY || document.documentElement.scrollTop || 0;
          var beforeX = window.scrollX || document.documentElement.scrollLeft || 0;

          badge.textContent = '● Live 5 min · ' + fmtTime();
          badge.style.borderColor = '#22c55e';
          setTimeout(function () {
            badge.style.borderColor = 'rgba(56,189,248,0.45)';
          }, 500);

          window.dispatchEvent(new CustomEvent('chronos:soft-refresh', { detail: { ts: Date.now() } }));
          requestAnimationFrame(function () {
            if (!userInteractedSinceLoad || Math.abs((window.scrollY || 0) - beforeY) > 8) {
              var currentY = window.scrollY || document.documentElement.scrollTop || 0;
              if (beforeY > 0 && currentY === 0) {
                window.scrollTo(beforeX, beforeY);
              }
            }
          });
        }, 300000);
      })();
    </script>
  </body>
