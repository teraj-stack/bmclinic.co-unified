      isStrona: screen === 'strona',
      stronaBack: () => this.setState({ screen: 'custom', cIdx: 0, navDir: -1 }),
      stronaNext: () => this.setState({ screen: 'custom', cIdx: 1, navDir: 1 }),
      isMap: screen === 'map',
      goCover: () => this.setState({ screen: 'cover' }),
      openMap: () => this.setState({ _mapFrom: { screen, cIdx: this.state.cIdx || 0 }, screen: 'map' }),
      mapBack: () => { const f = this.state._mapFrom || { screen: 'cover' }; this.setState({ screen: f.screen, cIdx: f.cIdx || 0 }); },
      letterBack: () => this.setState({ screen: 'custom', cIdx: 4, navDir: -1 }),
      glassRef: (this._glassRef = this._glassRef || React.createRef()),
      glassPrev: (e) => { e.stopPropagation(); this._glassPress(() => this.setState({ screen: 'custom', cIdx: 4, navDir: -1 })); },
      glassNext: (e) => { e.stopPropagation(); this._glassPress(() => this.setState({ screen: 'final', navDir: 1 })); },
      letterWave: () => {
        const disp = document.getElementById('lwDisp'); if (!disp) return;
        const t0 = performance.now();
        cancelAnimationFrame(this._lwR);
        const anim = (now) => {
          const t = (now - t0) / 1000;
          if (t > 3.4) { disp.setAttribute('scale', '0'); return; }
          const s = 34 * Math.exp(-t / 1.15) * Math.abs(Math.sin(t * 5.2));
          disp.setAttribute('scale', s.toFixed(1));
          this._lwR = requestAnimationFrame(anim);
        };
        this._lwR = requestAnimationFrame(anim);
      },
      mapItems: [
        { icon: '✦', name: 'Okładka', sub: 'Dla Milenki', go: () => this.setState({ screen: 'cover' }) },
        { icon: '♥', name: 'Serce-skarb', sub: 'dotknij i świeci', go: () => this.setState({ screen: 'gem' }) },
        ...this.customScreens().map((s, i) => ({ icon: '✧', name: s.title || s.label, sub: s.label, go: () => this.setState({ screen: 'custom', cIdx: i }) })),
        { icon: '❖', name: 'BMclinics', sub: 'ulubiona strona', go: () => this.setState({ screen: 'strona' }) },
        { icon: '☾', name: 'Słodkich snów', sub: 'życzenia', go: () => this.setState({ screen: 'final' }) },
        { icon: '✉', name: 'List', sub: 'Milenko,', go: () => this.setState({ screen: 'letter' }) },
      ],
      videoLoop: (e) => { const v = e.target; if (v.currentTime >= 6.0) v.currentTime = 0; },
      cHasMedia: !!this.customScreens()[this.state.cIdx || 0].media,
      cHasPhoto: !!this.customScreens()[this.state.cIdx || 0].photo,
      cHasPhoto1: screen === 'custom' && (this.state.cIdx || 0) === 1,
      cHasPhoto2: screen === 'custom' && (this.state.cIdx || 0) === 2,
      cHasPhoto3: screen === 'custom' && (this.state.cIdx || 0) === 3,
      photoGlowRef: (this._pgRef = this._pgRef || React.createRef()),
      parRef: (this._parRef = this._parRef || React.createRef()),
      tapFx: (e) => {
        const r = e.currentTarget.getBoundingClientRect();
        const rip = { x: e.clientX - r.left, y: e.clientY - r.top, id: Date.now() + Math.random() };
        this.setState({ rips: [...(this.state.rips || []), rip].slice(-5) });
        setTimeout(() => this.setState({ rips: (this.state.rips || []).filter(p => p.id !== rip.id) }), 700);
        setTimeout(() => this._clickSound(), 80);
      },
      photoMove: (e) => {
        const pt = e.touches ? e.touches[0] : e;
        const r0 = e.currentTarget.getBoundingClientRect();
        this._ptx = (pt.clientX - r0.left) / r0.width - 0.5;
        this._pty = (pt.clientY - r0.top) / r0.height - 0.5;
        const el = this._pgRef && this._pgRef.current; if (!el) return;
        const r = r0;
        const x = ((pt.clientX - r.left) / r.width) * 100;
        const y = ((pt.clientY - r.top) / r.height) * 100;
        const m = 'radial-gradient(ellipse 19% 15% at ' + x.toFixed(1) + '% ' + y.toFixed(1) + '%, #000 0%, rgba(0,0,0,.45) 55%, transparent 100%)';
        el.style.webkitMaskImage = m; el.style.maskImage = m;
        el.style.opacity = String(0.55 + 0.4 * (1 - y / 100));
      },
      photoLeave: () => { const el = this._pgRef && this._pgRef.current; if (el) el.style.opacity = '0'; this._ptx = 0; this._pty = 0; },
      phSpots: this._phSpots().map((h, i) => ({ ...h, pick: () => {
        const upd = { phSel: this.state.phSel === i ? null : i };
        if (h.act === 'bed') upd.bedLit = !this.state.bedLit;
        if (h.act === 'lamp') upd.lampsOn = !this.state.lampsOn;
        this.setState(upd);
      } })),
      ceilAnim: this.state.bedLit ? 'starsCeil 4.5s ease-in-out infinite alternate, twinkle 2.6s ease-in-out infinite' : 'starsCeil 14s ease-in-out infinite alternate, twinkle 6s ease-in-out infinite',
      bedGlowOp: this.state.bedLit ? 0.9 : 0,
      lampOp: this.state.lampsOn ? 1 : 0,
      heartOn: !!this.state.heartOn,
      heartToggle: () => this.setState({ heartOn: !this.state.heartOn }),
      hbOn: !!this.state.hbOn,
      hbKey: this.state.hb || 0,
      heartBurst: () => {
        const taps = (this.state.hTaps || 0) + 1;
        if (taps >= 5) {
          this.setState({ hb: (this.state.hb || 0) + 1, hbOn: true, hTaps: 0 });
          clearTimeout(this._hbT);
          this._hbT = setTimeout(() => this.setState({ screen: 'final', navDir: 1, hbOn: false, phSel: null }), 900);
          return;
        }
        this.setState({ hb: (this.state.hb || 0) + 1, hbOn: true, hTaps: taps });
        clearTimeout(this._hbT);
        this._hbT = setTimeout(() => this.setState({ hbOn: false }), 1400);
      },
      hbStars: (this._hbS = this._hbS || Array.from({ length: 9 }, (_, i) => ({
        a: ['heartShotA', 'heartShotB', 'heartShotC'][i % 3],
        s: (3 + (i % 4)).toFixed(0),
        dur: (0.7 + (i % 5) * 0.12).toFixed(2) + 's',
        dl: ((i % 4) * 0.07).toFixed(2) + 's',
      }))),
      fallStars: (this._fs = this._fs || Array.from({ length: 16 }, (_, i) => { const r = (s) => { const x = Math.sin(i * 91.7 + s * 47.3) * 10000; return x - Math.floor(x); }; return { l: 50 + r(1) * 46, s: (2 + r(2) * 2.6).toFixed(1), dur: (4.5 + r(3) * 6).toFixed(1) + 's', dl: (r(4) * 9).toFixed(1) + 's' }; })),
      komety: (this._km = this._km || [
        { src: '/landing/assets/kometa1.svg', l: 8, w: 110, dur: '9s', dl: '0s' },
        { src: '/landing/assets/kometa2.svg', l: 38, w: 90, dur: '12s', dl: '4s' },
        { src: '/landing/assets/kometa3.svg', l: 62, w: 105, dur: '10.5s', dl: '7.5s' },
        { src: '/landing/assets/kometa2.svg', l: 80, w: 70, dur: '14s', dl: '2s' },
        { src: '/landing/assets/kometa1.svg', l: 25, w: 75, dur: '13s', dl: '9.5s' },
      ]),
      fallFlares: (this._ffl = this._ffl || Array.from({ length: 5 }, (_, i) => { const r = (s) => { const x = Math.sin(i * 53.9 + s * 29.1) * 10000; return x - Math.floor(x); }; return { l: 52 + r(1) * 42, dur: (6 + r(2) * 5).toFixed(1) + 's', dl: (r(3) * 10).toFixed(1) + 's' }; })),
      phSelOn: this.state.phSel != null,
      phSelOp: this.state.phSel != null ? 0.95 : 0,
      phMask: this.state.phSel != null ? (() => { const h = this._phSpots()[this.state.phSel]; return 'radial-gradient(' + h.mx + ' at ' + h.x + '% ' + h.y + '%, #000 0%, rgba(0,0,0,.5) 60%, transparent 100%)'; })() : 'none',
      phSelX: this.state.phSel != null ? this._phSpots()[this.state.phSel].x : 0,
      phSelY: this.state.phSel != null ? this._phSpots()[this.state.phSel].y : 0,
      phTitle: this.state.phSel != null ? this._phSpots()[this.state.phSel].label : '',
      phDesc: this.state.phSel != null ? this._phSpots()[this.state.phSel].desc : '',
      phClose: () => this.setState({ phSel: null }),
      cHasText: !!(this.customScreens()[this.state.cIdx || 0].title || this.customScreens()[this.state.cIdx || 0].body),
      cNoText: !(this.customScreens()[this.state.cIdx || 0].title || this.customScreens()[this.state.cIdx || 0].body),
      cMedia: this.customScreens()[this.state.cIdx || 0].media,
      customWheel: (e) => { if (Math.abs(e.deltaY) < 18) return; this._scrollNav(e.deltaY > 0 ? 1 : -1); },
      customTouchStart: (e) => { this._ty = e.touches[0].clientY; },
      customTouchEnd: (e) => { const dy = (this._ty || 0) - e.changedTouches[0].clientY; if (Math.abs(dy) > 40) this._scrollNav(dy > 0 ? 1 : -1); },
      customBack: () => {
        const i = this.state.cIdx || 0;
        if (i === 0) this.setState({ screen: 'gem', navDir: -1, phSel: null });
        else if (i === 1) this.setState({ screen: 'strona', navDir: -1, phSel: null });
        else this.setState({ cIdx: i - 1, navDir: -1, phSel: null });
      },
      backToGem: () => this.setState({ screen: 'gem' }),
      gemTap: () => this.setState({ taps: Math.min(taps + 1, 5) }),
      gemLine: lines[Math.min(taps, 5)],
      gemReady: taps >= 5,
      gemDots: Array.from({ length: 5 }, (_, i) => ({
        c: i < taps ? '#f0c987' : 'rgba(179,154,126,.25)',
        g: i < taps ? '0 0 10px rgba(240,201,135,.8)' : 'none',
      })),
    };
  }
}
</script>
